<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Prospect Q&amp;A Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316171A'/%3E%3Ctext x='16' y='21' font-family='monospace' font-size='12' fill='white' text-anchor='middle'%3EQ%26A%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/sync.js">
  <link rel="modulepreload" href="js/utils.js">
  <link rel="modulepreload" href="js/similarity.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/views/library.js">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Icon sprite (replaces Font Awesome) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v5h16v-5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></symbol>
    <symbol id="i-review" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12l9-9h8v8l-9 9z"/><circle cx="16" cy="8" r="1.5"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-compare" viewBox="0 0 24 24"><path d="M8 3v18M16 3v18M3 8h5M16 16h5"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/></symbol>
  </svg>

  <div id="boot" class="boot" role="status">Loading…</div>

  <section id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card" novalidate>
      <div class="brand">
        <div class="brand-mark">Q&amp;A</div>
        <div class="brand-text"><strong>Prospect Q&amp;A Hub</strong><span>Sales knowledge base</span></div>
      </div>
      <div>
        <h1 id="auth-title">Sign in</h1>
        <p class="muted" id="auth-desc">Use the account your team authorized for the shared dataset.</p>
      </div>
      <div class="field">
        <label for="auth-email">Email</label>
        <input class="input" type="email" id="auth-email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="auth-password">Password</label>
        <input class="input" type="password" id="auth-password" autocomplete="current-password" minlength="6" required>
      </div>
      <div id="auth-error" class="form-error" role="alert" hidden></div>
      <div id="auth-note" class="form-note" role="status" hidden></div>
      <button type="submit" class="btn btn-primary btn-lg" id="auth-submit">Sign in</button>
      <div class="auth-links">
        <button type="button" class="link-btn" id="auth-toggle">Create an account</button>
        <button type="button" class="link-btn" id="auth-reset">Forgot password?</button>
      </div>
    </form>
  </section>

  <div id="app" class="app" hidden>
    <aside class="sidebar" aria-label="Main">
      <div class="brand">
        <div class="brand-mark">Q&amp;A</div>
        <div class="brand-text"><strong>Prospect Q&amp;A Hub</strong><span>Sales knowledge base</span></div>
      </div>
      <nav class="nav" aria-label="Sections">
        <a class="nav-link" href="#/library" data-route="library"><svg class="icon" aria-hidden="true"><use href="#i-library"/></svg><span class="grow">Library</span><span class="nav-count" data-count="library"></span></a>
        <a class="nav-link" href="#/review" data-route="review"><svg class="icon" aria-hidden="true"><use href="#i-review"/></svg><span class="grow">Review</span><span class="nav-badge" data-count="review" hidden></span></a>
        <a class="nav-link" href="#/insights" data-route="insights"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg><span class="grow">Insights</span></a>
        <a class="nav-link" href="#/rules" data-route="rules"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg><span class="grow">Matching rules</span></a>
      </nav>
      <nav class="nav" aria-label="Workspace">
        <span class="nav-heading">Workspace</span>
        <button class="nav-link" type="button" data-action="import"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>Import</button>
        <button class="nav-link" type="button" data-action="categories"><svg class="icon" aria-hidden="true"><use href="#i-tag"/></svg>Categories</button>
        <button class="nav-link" type="button" data-action="palette"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span class="grow">Quick find</span><span class="kbd">⌘K</span></button>
        <a class="nav-link" href="https://brotherpolo.github.io/ppscplanner" target="_blank" rel="noopener noreferrer"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg><span class="grow">PPSC Planner</span><svg class="icon icon-sm" aria-hidden="true"><use href="#i-external"/></svg></a>
      </nav>
      <div class="sidebar-foot">
        <button class="account-btn" type="button" data-action="account">
          <span class="avatar" data-user-initial>?</span>
          <span class="account-text"><strong data-user-email>Signed in</strong><span class="sync" data-sync data-state="synced">Synced</span></span>
        </button>
      </div>
    </aside>

    <main class="main" id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Sections">
      <a class="tab-link" href="#/library" data-route="library"><svg class="icon" aria-hidden="true"><use href="#i-library"/></svg>Library</a>
      <a class="tab-link" href="#/review" data-route="review"><svg class="icon" aria-hidden="true"><use href="#i-review"/></svg><span>Review<span data-count="review-tab"></span></span></a>
      <a class="tab-link" href="#/insights" data-route="insights"><svg class="icon" aria-hidden="true"><use href="#i-chart"/></svg>Insights</a>
      <button class="tab-link" type="button" data-action="more"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>More</button>
    </nav>
  </div>

  <dialog id="dialog" class="dialog" aria-labelledby="dlg-title"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
